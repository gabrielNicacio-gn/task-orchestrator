services:
  postgres:
    image: postgres:17.11
    container_name: orquestrador-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orquestrador
      POSTGRES_USER: orquestrador
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orquestrador -d orquestrador" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
